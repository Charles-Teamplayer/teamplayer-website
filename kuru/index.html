<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KURU | TEAMPLAYER</title>
<meta name="description" content="KURU — 여러 채널 메시지를 한곳에서 받고 답하고, 예약과 고객 기록을 함께 관리하는 매장용 메시징 서비스.">
<link rel="icon" href="/favicon.ico">
<link rel="alternate" hreflang="ko" href="https://teamplayer.co.kr/kuru/?lang=ko">
<link rel="alternate" hreflang="ja" href="https://teamplayer.co.kr/kuru/?lang=ja">
<link rel="alternate" hreflang="en" href="https://teamplayer.co.kr/kuru/?lang=en">
<style>
:root{--teal:#176e62;--teal-weak:#e6f1ee;--stamp:#b92b27;--ink:#1d2624;--sub:#55625f;--line:#dfe7e4;--bg:#fbfaf7;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Hiragino Sans","Noto Sans JP","Noto Sans KR","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:lang(ko) h1,:lang(ko) .lead,:lang(ko) p{word-break:keep-all}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:10;background:rgba(251,250,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.04em}
.brand svg{width:34px;height:34px}
.nav{display:flex;align-items:center;gap:14px;font-size:14px}
.nav .co{color:var(--sub)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--sub)}
.langs button[aria-pressed=true]{background:var(--teal);color:#fff}
.hero{padding-top:72px;padding-bottom:56px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-weak);padding:4px 12px;border-radius:999px;margin-bottom:18px}
h1{word-break:auto-phrase;font-size:clamp(30px,5vw,48px);line-height:1.25;letter-spacing:-.01em;margin-bottom:18px}
.lead{font-size:18px;color:var(--sub);margin-bottom:28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:12px;font-weight:700;font-size:16px}
.btn.primary{background:var(--stamp);color:#fff}
.btn.primary:hover{background:#9e2421}
.btn.ghost{border:1.5px solid var(--teal);color:var(--teal)}
.btn.ghost:hover{background:var(--teal-weak)}
.mock{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 50px rgba(23,110,98,.12);padding:18px}
.mock-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:12px}
.mock-h svg{width:22px;height:22px}
.msg{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px}
.msg+.msg{margin-top:4px}
.msg:nth-child(odd){background:#f6f8f7}
.ch{flex:none;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;margin-top:2px}
.msg b{display:block;font-size:13px}
.msg span{font-size:13px;color:var(--sub)}
.reply{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--teal);font-weight:600}
section{padding:64px 0}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.35;margin-bottom:10px;text-align:center}
.sec-lead{text-align:center;color:var(--sub);margin-bottom:36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
.ico{width:46px;height:46px;border-radius:12px;background:var(--teal-weak);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.ico svg{width:24px;height:24px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:19px;margin-bottom:8px}
.card p{color:var(--sub);font-size:15px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600}
.alt{background:var(--teal-weak)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--stamp);border:1px solid var(--stamp);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.cta{background:var(--teal);color:#fff;border-radius:24px;padding:48px 28px;text-align:center}
.cta h2{color:#fff}
.cta p{opacity:.85;margin-bottom:24px}
.cta .btns{justify-content:center}
.cta .btn.ghost{border-color:#fff;color:#fff}
.cta .btn.ghost:hover{background:rgba(255,255,255,.12)}
footer{padding:32px 0 48px;color:var(--sub);font-size:13px;text-align:center}
footer a{text-decoration:underline}
@media (max-width:820px){
  .hero{padding-top:44px;padding-bottom:36px}
  .hero-grid,.grid3,.grid2{grid-template-columns:1fr}
  .nav .co{display:none}
  section{padding:48px 0}
  .btn{flex:1 1 100%}
}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="/kuru/" aria-label="KURU">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="94" fill="#b92b27"/><g transform="rotate(-8 100 100)" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M74 54H126"/><path d="M52 98H148"/><path d="M100 36V162"/><path d="M100 104L64 152"/><path d="M100 104L136 152"/></g><g transform="rotate(-8 100 100)" fill="#fff"><circle cx="80" cy="76" r="8.5"/><circle cx="120" cy="76" r="8.5"/></g></svg>
      KURU
    </a>
    <nav class="nav">
      <a class="co" href="/" data-i="nav.company"></a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </nav>
  </div>
</header>

        <div class="msg"><i class="ch" style="background:#55625f" data-i="mock.email"></i><div><b data-i="mock.m4n"></b><span data-i="mock.m4"></span></div></div>
        <div class="reply" data-i="mock.reply"></div>
      </div>
    </div>
  </div>

  <section>
    <div class="wrap">
      <h2 data-i="feat.title"></h2>
      <p class="sec-lead" data-i="feat.lead"></p>
      <div class="grid3">
        <div class="card">
          <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></div>
          <h3 data-i="f1.t"></h3><p data-i="f1.d"></p>
        </div>
        <div class="card">
          <div class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M8 14h3"/></svg></div>
          <h3 data-i="f2.t"></h3><p data-i="f2.d"></p>
        </div>
        <div class="card">
          <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></div>
          <h3 data-i="f3.t"></h3><p data-i="f3.d"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="alt">
    <div class="wrap">
      <h2 data-i="ch.title"></h2>
      <p class="sec-lead" data-i="ch.lead"></p>
      <div class="chips">
        <span>LINE</span><span>iMessage</span><span data-i="ch.email"></span><span data-i="ch.webform"></span><span>SMS</span><span data-i="ch.kakao"></span><span data-i="ch.phone"></span>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 data-i="plan.title"></h2>
      <p class="sec-lead" data-i="plan.lead"></p>
      <div class="grid2">
        <div class="card">
          <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M7 7V5h10v2M7 13h4"/></svg></div>
          <h3 data-i="p1.t"></h3><p data-i="p1.d"></p>
        </div>
        <div class="card">
          <div class="ico"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-7.95A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg></div>
          <h3><span data-i="p2.t"></span><span class="tag" data-i="p2.tag"></span></h3><p data-i="p2.d"></p>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="cta">
        <h2 data-i="cta.title"></h2>
        <p data-i="cta.lead"></p>
        <div class="btns">
          <a class="btn primary js-demo" href="/kuru/demo/" data-i="btn.demo"></a>
          <a class="btn ghost" href="/support/" data-i="btn.contact"></a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">© TEAMPLAYER · <a href="/" data-i="nav.company"></a></div>
</footer>
