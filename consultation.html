<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TEAMPLAYER 상담 문의" />
    <title>상담 요청 - TEAMPLAYER</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: linear-gradient(135deg, #edf2ff, #fff2f4); }
      main { width: min(620px, 100%); padding: clamp(28px, 6vw, 56px); text-align: center; background: rgba(255,255,255,.92); border: 1px solid rgba(26,48,97,.12); border-radius: 28px; box-shadow: 0 24px 70px rgba(33,55,102,.16); }
      img { width: min(220px, 70%); height: auto; }
      h1 { margin: 28px 0 12px; font-size: clamp(28px, 6vw, 42px); }
      p { margin: 0 auto; max-width: 470px; color: #59657a; line-height: 1.7; }
      .actions { display: grid; gap: 12px; margin-top: 32px; }
      a { display: block; padding: 15px 20px; border-radius: 12px; color: #fff; font-weight: 700; text-decoration: none; background: linear-gradient(135deg, #c72f40, #244f9d); }
      a.secondary { color: #32405b; background: #eef1f7; }
      small { display: block; margin-top: 24px; color: #7b8494; }
    </style>
  </head>
  <body>
    <main>
      <img src="/teamplayer-logo.png" alt="TEAMPLAYER" />
      <h1>상담 문의</h1>
      <p>현재 웹 상담폼을 점검하고 있습니다. 개인정보를 입력하는 대신 공식 이메일 또는 대표번호로 문의해 주세요.</p>
      <div class="actions">
        <a href="mailto:teamplayer@teamplayer.co.kr">teamplayer@teamplayer.co.kr</a>
        <a class="secondary" href="tel:1522-8061">대표번호 1522-8061</a>
        <a class="secondary" href="/">홈으로 돌아가기</a>
      </div>
      <small>이 화면에서는 개인정보를 수집하거나 전송하지 않습니다.</small>
    </main>
  </body>
</html>
